services:
  backend:
    image: ghcr.io/projeto-1-corretor-prova/backend-dotnet:latest
    container_name: backend-dotnet
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "$API_PORT:8080"
      - "8000:8081"
    depends_on:
      - postgres

  postgres:
    image: postgres:latest
    container_name: postgres
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/MAJOR/docker
        
volumes:
    pgdata: